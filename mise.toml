# Single source of truth for tool versions and project commands: local dev and
# CI both read the pins and run the tasks from here (`mise run <task>`).
[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
goreleaser = "2.20.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
jq = "1.8.2"
trufflehog = "3.99.8"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:github.com/google/go-licenses/v2" = "2.0.1"
# Node only provides the npm backend for the two CLIs below.
node = "26"
"npm:markdownlint-cli" = "0.50.0"
# @commitlint/config-conventional installs nested inside the CLI, so
# commitlint.config.js extends it without a second pin.
"npm:@commitlint/cli" = "21.2.4"

[tasks.lint]
description = "Run every check"
depends = ["lint-go", "fmt-check", "tidy-check", "go-version-check", "lint-md", "lint-actions", "lint-commit", "govulncheck", "license-check", "scan-secrets"]

[tasks.build]
description = "Build every package"
run = "go build ./..."

[tasks.test]
description = "Run the full test suite"
run = "go test ./..."

[tasks.vet]
description = "go vet, including the opt-in live_verify build tag"
shell = "bash -euo pipefail -c"
run = '''
go vet ./...
go vet -tags live_verify ./...
'''

[tasks.cross]
description = "Cross-compile for every released OS"
shell = "bash -euo pipefail -c"
run = '''
for os in linux darwin windows; do
  echo "==> GOOS=$os"
  GOOS=$os GOARCH=amd64 go build ./...
done
'''

[tasks.lint-go]
description = "golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt-check]
description = "Fail if any file is not gofmt -s clean"
shell = "bash -euo pipefail -c"
run = '''
out=$(gofmt -s -l .)
if [ -n "$out" ]; then
  echo "gofmt -s needed:" >&2
  echo "$out" >&2
  exit 1
fi
'''

[tasks.tidy-check]
description = "Fail if go mod tidy would change go.mod or go.sum"
shell = "bash -euo pipefail -c"
run = '''
go mod tidy
git diff --exit-code -- go.mod go.sum
'''

[tasks.go-version-check]
description = "Fail if the go directive in go.mod differs from the mise pin"
shell = "bash -euo pipefail -c"
run = '''
want=$(mise current go)
have=$(awk '/^go /{print $2; exit}' go.mod)
if [ "$want" != "$have" ]; then
  echo "go.mod says go $have, mise.toml pins $want" >&2
  exit 1
fi
'''

# jaxxstorm/vers (a tscli dependency) states Apache-2.0 in its README but ships
# no LICENSE file, so go-licenses cannot classify it. Drop the --ignore once
# upstream adds one.
#
# segmentio/asm (an ax-go MCP dependency, via the MCP SDK) is MIT No Attribution
# (MIT-0), which is permissive but is not in the allowlist and which go-licenses
# reports as Unknown. Drop the --ignore once go-licenses classifies MIT-0 or the
# allowlist names it.
[tasks.license-check]
description = "Fail on a dependency outside the license allowlist"
run = "go-licenses check ./... --ignore github.com/jaxxstorm/vers --ignore github.com/segmentio/asm --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0"

[tasks.release-check]
description = "Validate .goreleaser.yaml and build a snapshot"
shell = "bash -euo pipefail -c"
run = '''
goreleaser check
goreleaser release --snapshot --clean --skip=publish
'''

[tasks.lint-md]
description = "markdownlint all authored markdown"
run = "markdownlint '**/*.md'"

[tasks.lint-actions]
description = "actionlint the GitHub workflows"
run = "actionlint"

[tasks.lint-commit]
description = "commitlint the branch (COMMIT_FROM/COMMIT_TO override the range)"
shell = "bash -euo pipefail -c"
run = 'commitlint --from "${COMMIT_FROM:-$(git merge-base HEAD origin/main)}" --to "${COMMIT_TO:-HEAD}" --verbose'

[tasks.govulncheck]
description = "Scan Go dependencies for known vulnerabilities"
# vuln.go.dev resets connections now and then. govulncheck exits 3 when it finds
# vulnerabilities, which must fail at once; any other failure is retried.
run = '''
for attempt in 1 2 3; do
  govulncheck ./... && exit 0
  status=$?
  [ "$status" = 3 ] && exit 3
  [ "$attempt" = 3 ] || { echo "govulncheck failed (attempt $attempt); retrying" >&2; sleep $((attempt * 10)); }
done
exit 1
'''

[tasks.scan-secrets]
description = "Run both secret scanners"
depends = ["scan-gitleaks", "scan-trufflehog"]

[tasks.scan-gitleaks]
description = "gitleaks secret patterns (SCAN_BASE limits it to SCAN_BASE..SCAN_HEAD)"
shell = "bash -euo pipefail -c"
run = '''
range=()
if [ -n "${SCAN_BASE:-}" ]; then
  range=(--log-opts "$SCAN_BASE..${SCAN_HEAD:-HEAD}")
fi
gitleaks git --no-banner --redact "${range[@]}"
'''

[tasks.scan-trufflehog]
description = "trufflehog verified live credentials (SCAN_BASE limits it to commits after SCAN_BASE)"
shell = "bash -euo pipefail -c"
run = '''
since=()
if [ -n "${SCAN_BASE:-}" ]; then
  since=(--since-commit "$SCAN_BASE")
fi
trufflehog git "file://$PWD" "${since[@]}" --branch HEAD --only-verified --fail --no-update
'''

[tasks.scan-trufflehog-report]
description = "trufflehog including unverified and unknown results, redacted to detector and location (never fails)"
shell = "bash -euo pipefail -c"
run = '''
since=()
if [ -n "${SCAN_BASE:-}" ]; then
  since=(--since-commit "$SCAN_BASE")
fi
# Raw and Redacted fields are dropped on purpose: an unverified hit may be a
# real but revoked credential, and CI logs outlive the secret's rotation.
trufflehog git "file://$PWD" "${since[@]}" --branch HEAD \
  --results=verified,unknown,unverified --json --no-update \
  | jq -r 'select(.DetectorName) | "\(.DetectorName) verified=\(.Verified) \(.SourceMetadata.Data.Git.file // "?"):\(.SourceMetadata.Data.Git.line // 0) \(.SourceMetadata.Data.Git.commit // "?")"' \
  | sort -u | tee /dev/stderr | { grep -c . || true; } | sed 's/^/findings: /'
'''

[tasks.scan-staged]
description = "gitleaks over the staged changes (the pre-commit check)"
run = "gitleaks git --staged --no-banner --redact"

[tasks.install-hooks]
description = "Install a pre-commit hook that runs gitleaks on the staged changes"
shell = "bash -euo pipefail -c"
run = '''
# The hook lives in the real git directory and calls gitleaks directly. It does
# not use core.hooksPath (a tracked hook directory would let any checked-out
# branch change what runs on your next commit) and does not run a mise task
# (that would execute whatever the checked-out mise.toml defines). It still
# reads .gitleaks.toml from the working tree, which is data, not code.
if [ -n "$(git config --get core.hooksPath || true)" ]; then
  echo "core.hooksPath is set; refusing to install. Unset it or install the hook there by hand." >&2
  exit 1
fi
hook="$(git rev-parse --git-common-dir)/hooks/pre-commit"
mkdir -p "$(dirname "$hook")"
rm -f "$hook"
cat > "$hook" <<'HOOK'
#!/usr/bin/env bash
set -euo pipefail
command -v gitleaks >/dev/null || { echo "pre-commit: gitleaks not found; run mise install" >&2; exit 1; }
exec gitleaks git --staged --no-banner --redact
HOOK
chmod +x "$hook"
echo "installed $hook"
'''

[tasks.apidiff]
description = "Incompatible pkg/ API changes since APIDIFF_BASE (default origin/main)"
run = 'scripts/apidiff.sh "${APIDIFF_BASE:-origin/main}"'
