# Opt-in, credentialed live-verify tier.
#
# Every other test here is pure and offline. That cannot validate a claim like
# "this vocabulary or response shape still matches what the real control plane
# returns today". This workflow is that opt-in tier, excluded from ordinary CI.
# It runs three read-only live tests:
#
#   - pkg/policycore/posture TestLiveVerifyCountryVocabulary re-derives the
#     ip:country vocabulary from /acl/validate rejections and compares it to the
#     fixture.
#   - integration TestLiveValidate* probes the /acl/validate response shapes
#     the validation gate depends on. The harness allows only POST validate and
#     GET policy requests, and the endpoint never applies the policy.
#   - integration TestLiveServiceLookupNameSpelling checks which Service name
#     spelling the lookup endpoint accepts.
#
# The tailnet is shared, so live-verify never runs on a pull request: it runs
# only on workflow_dispatch from main, after the change has merged, and waits
# for the protected `live-verify` environment's required reviewer.
#
# compile-check runs on PRs that touch the live tests and needs no credentials.
# A build tag nobody compiles by default rots unnoticed, so it vets the
# live_verify-tagged tests to prove they still compile; it never executes them.
#
# The job reads TAILSCALE_API_KEY and TAILSCALE_TAILNET from secrets stored on
# the `live-verify` environment, so they are released only to an approved run on
# main. Use a read-only API key or OAuth client, and keep it out of
# repository-level secrets so no other workflow can read it. TSACL_CAPTURE
# is deliberately never set: it would rewrite fixtures.
#
# The probes need one real login to build a selector from. When the deployed
# policy has no literal email, store one that exists on the tailnet as the
# `live-verify` environment secret TSACL_LIVE_USER; it is never printed.
name: Live verify

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "pkg/policycore/posture/**"
      - "integration/**"
      - "internal/tailapi/**"
      - ".github/workflows/live-verify.yml"

permissions:
  contents: read

concurrency:
  group: live-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  compile-check:
    name: Compile live_verify-tagged files (no credentials)
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5

      - name: go vet with the live_verify tag
        run: go vet -tags live_verify ./...

  live-verify:
    name: Run live-verify against a real tailnet (opt-in)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    environment: live-verify
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5

      - name: Run live-verify tests
        env:
          TAILSCALE_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
          TAILSCALE_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}
          TSACL_LIVE_USER: ${{ secrets.TSACL_LIVE_USER }}
          TSACL_LIVE: "1"
        run: |
          set -uo pipefail
          : "${TAILSCALE_API_KEY:?set the TAILSCALE_API_KEY secret on the live-verify environment}"
          : "${TAILSCALE_TAILNET:?set the TAILSCALE_TAILNET secret on the live-verify environment}"

          status=0
          run_set() {
            local name=$1
            shift
            local log
            log=$(mktemp)
            echo "::group::$name"
            go test -count=1 -v "$@" 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            local passed skipped
            passed=$(grep -c '^--- PASS' "$log" || true)
            skipped=$(grep -c '^--- SKIP' "$log" || true)
            echo "$name: $passed passed, $skipped skipped"
            if [[ "$rc" -ne 0 ]]; then
              echo "::error::$name failed"
              status=1
            elif [[ "$passed" -eq 0 ]]; then
              echo "::error::$name ran no passing test, so it proved nothing"
              status=1
            fi
          }

          run_set "posture vocabulary" -tags live_verify ./pkg/policycore/posture/ -run TestLiveVerify
          run_set "control-plane probes" ./integration/ -run TestLive
          exit "$status"
